<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa Interactivo - HydroTrace AI</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.heat/0.2.0/leaflet-heat.js"></script>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #06080F;
            font-family: sans-serif;
        }
        #map {
            width: 100vw;
            height: 100vh;
        }

        /* Botón toggle mapa de calor */
        #btn-heat {
            position: absolute;
            top: 14px;
            right: 14px;
            z-index: 1000;
            background: rgba(13,17,23,0.88);
            border: 1px solid rgba(255,45,85,0.4);
            color: #FF2D55;
            font-size: 12px;
            font-weight: 700;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: all 0.2s;
            letter-spacing: 0.04em;
        }
        #btn-heat:hover {
            background: rgba(255,45,85,0.15);
        }
        #btn-heat.activo {
            background: rgba(255,45,85,0.22);
            border-color: #FF2D55;
        }

        /* Botón pantalla completa */
        #btn-fullscreen {
            position: absolute;
            top: 14px;
            right: 160px; /* Separación para que no tape el otro botón */
            z-index: 1000;
            background: rgba(13,17,23,0.88);
            border: 1px solid rgba(99,102,241,0.35);
            color: #A78BFA;
            font-size: 12px;
            font-weight: 700;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: all 0.2s;
            letter-spacing: 0.04em;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        #btn-fullscreen:hover {
            background: rgba(167,139,250,0.15);
            border-color: #A78BFA;
        }

        /* Asegurar que leyenda y botones se vean en fullscreen */
        :-webkit-full-screen #leyenda,
        :-webkit-full-screen #btn-heat,
        :-webkit-full-screen #btn-fullscreen { display: flex; }
        :fullscreen #leyenda,
        :fullscreen #btn-heat,
        :fullscreen #btn-fullscreen { display: flex; }

        /* Leyenda flotante */
        #leyenda {
            position: absolute;
            bottom: 30px;
            right: 14px;
            z-index: 1000;
            background: rgba(13,17,23,0.88);
            border: 1px solid rgba(99,102,241,0.2);
            border-radius: 8px;
            padding: 12px 16px;
            backdrop-filter: blur(8px);
        }
        #leyenda .titulo {
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: rgba(148,163,184,0.45);
            margin-bottom: 9px;
        }
        #leyenda .item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
            font-size: 12px;
            color: rgba(226,232,240,0.75);
        }
        #leyenda .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <button id="btn-heat" onclick="toggleCalor()">🌡 Mapa de Calor</button>
    
    <button id="btn-fullscreen" onclick="toggleFullscreen()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
        </svg>
        Pantalla Completa
    </button>

    <div id="leyenda">
        <div class="titulo">Nivel de riesgo</div>
        <div class="item"><span class="dot" style="background:#FF2D55;box-shadow:0 0 6px rgba(255,45,85,0.6);"></span>Crítico</div>
        <div class="item"><span class="dot" style="background:#FF9F0A;box-shadow:0 0 6px rgba(255,159,10,0.6);"></span>Sospechoso</div>
        <div class="item"><span class="dot" style="background:#30D158;box-shadow:0 0 6px rgba(48,209,88,0.5);"></span>Deficiencia</div>
        <div class="item"><span class="dot" style="background:#0A84FF;box-shadow:0 0 6px rgba(10,132,255,0.5);"></span>Normal</div>
    </div>

    <script>
        // Límites geográficos de la CDMX
        const CDMX_BOUNDS = L.latLngBounds(
            L.latLng(19.05, -99.40),
            L.latLng(19.65, -98.90)
        );

        const map = L.map('map', {
            minZoom            : 10,
            maxZoom            : 17,
            maxBounds          : CDMX_BOUNDS,
            maxBoundsViscosity : 1.0
        }).setView([19.35, -99.15], 11);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
            subdomains: 'abcd',
            maxZoom: 17
        }).addTo(map);

        let calorCapa   = null;
        let calorActivo = false;
        let marcadores  = []; 

        function toggleCalor() {
            if (!calorCapa) return;
            const btn = document.getElementById('btn-heat');
            if (calorActivo) {
                map.removeLayer(calorCapa);
                marcadores.forEach(m => m.addTo(map));
                calorActivo = false;
                btn.classList.remove('activo');
                btn.textContent = '🌡 Mapa de Calor';
            } else {
                marcadores.forEach(m => map.removeLayer(m));
                calorCapa.addTo(map);
                calorActivo = true;
                btn.classList.add('activo');
                btn.textContent = '✕ Ocultar Calor';
            }
        }

        // NUEVO: Función para alternar Pantalla Completa
        function toggleFullscreen() {
            const btn = document.getElementById('btn-fullscreen');
            const iconExpand = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg> Pantalla Completa`;
            const iconCollapse = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"/></svg> Salir`;

            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().then(() => {
                    btn.innerHTML = iconCollapse;
                    setTimeout(() => map.invalidateSize(), 300);
                }).catch(err => console.warn('Fullscreen no disponible:', err));
            } else {
                document.exitFullscreen().then(() => {
                    btn.innerHTML = iconExpand;
                    setTimeout(() => map.invalidateSize(), 300);
                });
            }
        }

        // NUEVO: Sincronizar el botón si el usuario sale presionando "Esc"
        document.addEventListener('fullscreenchange', () => {
            const btn = document.getElementById('btn-fullscreen');
            if (!document.fullscreenElement) {
                btn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg> Pantalla Completa`;
                setTimeout(() => map.invalidateSize(), 300);
            }
        });

        // Tu Fetch original, limpio e intacto
        fetch('/api/mapa-datos')
          .then(r => r.json())
          .then(puntos => {

            const maxExceso = Math.max(...puntos.map(p => p.exceso_m3 || 0));
            const heatPoints = puntos.map(p => [
                p.lat, p.lon,
                maxExceso > 0 ? (p.exceso_m3 || 0) / maxExceso : 0.5
            ]);

            calorCapa = L.heatLayer(heatPoints, {
                radius  : 35,
                blur    : 25,
                maxZoom : 14,
                gradient: {
                    0.0 : '#0A84FF',
                    0.4 : '#30D158',
                    0.65: '#FF9F0A',
                    1.0 : '#FF2D55'
                }
            });

            // Marcadores
            puntos.forEach(p => {
                const m = L.circleMarker([p.lat, p.lon], {
                    color      : p.color,
                    fillColor  : p.color,
                    fillOpacity: 0.6,
                    radius     : 8,
                    weight     : 2
                })
                .bindPopup(p.popup_html)
                .addTo(map);
                marcadores.push(m);
            });
          })
          .catch(err => console.error("Error cargando los datos del mapa:", err));
    </script>
</body>
</html>
